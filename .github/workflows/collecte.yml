name: Collecte RTE quotidienne

on:
  schedule:
    # Toutes les deux heures, à la 10e minute (heure UTC, soit 2h10, 4h10 ... 22h10 Paris en été, décalé d'une heure en hiver).
    # Avant 14h Paris, le DA renvoyé est celui du jour (déjà stocké) et le script sort en code 2 : sans conséquence.
    # Après 14h, le DA de J+1 est pris ; l'aFRR capacité de J+1 dès 9h30 ; les activations aFRR se complètent au fil de la journée.
    - cron: "10 */2 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Appel des API RTE
        env:
          RTE_KEY_B64: ${{ secrets.RTE_KEY_B64 }}
        run: python scripts/collecte_rte.py
        continue-on-error: true
      - name: Calcul des revenus de référence
        run: python scripts/calcul_revenu.py
        continue-on-error: true
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "robot-collecte"
          git config user.email "robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collecte $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push refusé, nouvelle tentative $i" ; sleep 10
          done
