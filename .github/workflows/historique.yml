name: Rattrapage historique

on:
  workflow_dispatch:
    inputs:
      du:
        description: "Premier jour (AAAA-MM-JJ)"
        required: true
      au:
        description: "Dernier jour (AAAA-MM-JJ)"
        required: true
      refaire_da:
        description: "Retélécharger le day-ahead des jours déjà présents et recalculer leurs revenus (jours isolés : du = au)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Récupération des données historiques
        env:
          RTE_KEY_B64: ${{ secrets.RTE_KEY_B64 }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/historique.py "${{ github.event.inputs.du }}" "${{ github.event.inputs.au }}" ${{ inputs.refaire_da && '--force --sans-afrr' || '' }}
      - name: Indisponibilités nucléaires connues à 8h45 J-1 (un appel par mois, pause de 3 min entre les mois)
        env:
          RTE_KEY_B64: ${{ secrets.RTE_KEY_B64 }}
        run: python scripts/collecte_indispo.py "${{ github.event.inputs.du }}" "${{ github.event.inputs.au }}"
        continue-on-error: true
        timeout-minutes: 240
      - name: Calcul des revenus sur les jours ajoutés
        run: python scripts/calcul_revenu.py ${{ inputs.refaire_da && format('--force {0} {1}', github.event.inputs.du, github.event.inputs.au) || '' }}
        continue-on-error: true
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "robot-collecte"
          git config user.email "robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Historique ${{ github.event.inputs.du }} -> ${{ github.event.inputs.au }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push refusé, nouvelle tentative $i" ; sleep 10
          done
