name: Collecte RTE quotidienne

on:
  schedule:
    # RTE bascule sur J+1 entre 13h et 14h Paris (guide Wholesale Market v3). On appelle après 14h.
    # GitHub utilise l'heure UTC : 12:10 UTC = 14:10 Paris en été ; 13:10 UTC = 14:10 Paris en hiver.
    # Deux passages plus une relance chacun ; le script est sans effet s'il a déjà la journée.
    - cron: "10 12 * * *"
    - cron: "40 12 * * *"
    - cron: "10 13 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Appel des API RTE
        env:
          RTE_KEY_B64: ${{ secrets.RTE_KEY_B64 }}
        run: python scripts/collecte_rte.py
        continue-on-error: true
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "robot-collecte"
          git config user.email "robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collecte $(date -u +%F)"
          git push
